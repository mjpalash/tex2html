<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>$title$</title>

  <style>
    /* --- Base Typography --- */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fdfdfd;
    }

    /* Smart dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        color: #e0e0e0;
        background: #111;
      }
      a { color: #8ab4f8; }
      code { background: #222; }
      pre code { background: #111; }
      blockquote { color: #ccc; border-left-color: #444; }
      table th { background: #222; }
      table td { background: #111; }
    }

    /* --- Page Container --- */
    .container {
      max-width: 860px;
      padding: 40px 20px;
      margin: 0 auto;
    }

    /* --- Title Block --- */
    h1.title {
      font-size: 2.4em;
      font-weight: 700;
      margin-bottom: 0.2em;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      font-style: italic;
      color: #666;
      margin-bottom: 2em;
    }
    .author, .date {
      text-align: center;
      color: #666;
      margin-top: -0.5em;
    }

    /* --- Headings --- */
    h1, h2, h3, h4 {
      margin-top: 2em;
      margin-bottom: 0.6em;
      font-weight: 600;
      color: #333;
    }
    @media (prefers-color-scheme: dark) {
      h1, h2, h3, h4 { color: #e0e0e0; }
    }

    /* --- Paragraphs & Lists --- */
    p {
      margin: 1em 0;
      font-size: 1.08em;
    }
    li {
      margin: 0.4em 0;
    }

    /* --- Code Blocks --- */
    pre {
      padding: 12px;
      background: #f4f4f4;
      overflow-x: auto;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    pre code {
      font-size: 0.95em;
      background: none;
    }
    code {
      background: #f4f4f4;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.95em;
    }

    /* --- Links --- */
    a {
      color: #005cc5;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* --- Blockquotes --- */
    blockquote {
      margin: 1.5em 0;
      padding-left: 1em;
      border-left: 4px solid #ccc;
      color: #555;
      font-style: italic;
    }

    /* --- Tables --- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5em 0;
      font-size: 0.95em;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
    }
    th {
      background: #f0f0f0;
      font-weight: 600;
    }

    /* --- Images --- */
    img {
      max-width: 100%;
      display: block;
      margin: 1.2em auto;
    }

    /* --- MathJax adjustments (optional) --- */
    .math.display {
      margin: 1.5em 0;
      text-align: center;
    }
  </style>

  $for(header-includes)$
    $header-includes$
  $endfor$

$if(math)$
  <!-- MathJax v3 (safe pandoc template block) -->
  <script>
    window.MathJax = {
      tex: {
        tags: "ams"
      },
      svg: {
        fontCache: "global"
      }
    };
  </script>
  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
$endif$

  <!-- $if(mathjax)$
    $mathjax$
  $endif$
 -->
</head>

<body>
<div class="container">

  $if(title)$
    <h1 class="title">$title$</h1>
  $endif$

  $if(subtitle)$
    <div class="subtitle">$subtitle$</div>
  $endif$

  $for(author)$
    <div class="author">$author$</div>
  $endfor$

  $if(date)$
    <div class="date">$date$</div>
  $endif$

  <hr style="margin: 2em 0; border: 0; border-top: 1px solid #ccc;" />

  $body$

</div>
</body>
</html>
